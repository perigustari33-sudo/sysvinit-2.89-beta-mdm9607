name: Build Statically Linked Sysvinit for ARM (Soft-float)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install ARM GCC toolchain (arm-none-eabi)
      run: |
        sudo apt-get update
        # Paket ini menyediakan toolchain arm-none-eabi
        sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi make

    - name: Compile Sysvinit statically for ARM with soft-float
      run: |
        cd src
        # Flag penting: -mfloat-abi=soft untuk soft-float ABI [citation:1][citation:5][citation:11]
        # -static untuk link statis
        make -e CC=arm-none-eabi-gcc CFLAGS="-mfloat-abi=soft" LDFLAGS="-static"

    - name: Upload binaries as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: sysvinit-static-arm-softfloat
        path: |
          src/init
          src/halt
          src/shutdown
          src/runlevel
          src/killall5
          src/fstab-decode
          src/sulogin
