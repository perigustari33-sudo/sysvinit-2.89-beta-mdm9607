name: Build Statically Linked Sysvinit for ARMv7-a (Hard-Float) - Without sulogin

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download and extract Linaro GCC
      run: |
        wget https://archive.org/download/arm-linux-musleabihf-cross/gcc-linaro-4.9.4-2017.01-x86_64_arm-linux-gnueabihf.tar.xz
        tar -xf gcc-linaro-4.9.4-2017.01-x86_64_arm-linux-gnueabihf.tar.xz
        echo "${{ github.workspace }}/gcc-linaro-4.9.4-2017.01-x86_64_arm-linux-gnueabihf/bin" >> $GITHUB_PATH

    - name: Remove sulogin from Makefile
      run: |
        cd src
        # Backup Makefile
        cp Makefile Makefile.bak
        
        # Hapus sulogin dari SBIN di bagian DISTRO kosong
        sed -i '/^ifeq ($(DISTRO),)$/,/^endif/ s/SBIN	+= sulogin bootlogd/SBIN	+= bootlogd/' Makefile
        sed -i '/^ifeq ($(DISTRO),)$/,/^endif/ s/MAN8	+= sulogin.8 bootlogd.8/MAN8	+= bootlogd.8/' Makefile
        
        # Hapus sulogin dari SBIN di bagian Debian
        sed -i '/^ifeq ($(DISTRO),Debian)$/,/^endif/ s/SBIN	+= sulogin bootlogd/SBIN	+= bootlogd/' Makefile
        sed -i '/^ifeq ($(DISTRO),Debian)$/,/^endif/ s/MAN8	+= sulogin.8 bootlogd.8/MAN8	+= bootlogd.8/' Makefile
        
        # Hapus sulogin dari SBIN di bagian SuSE
        sed -i '/^ifeq ($(DISTRO),SuSE)$/,/^endif/ s/SBIN	+= sulogin/SBIN	+=/' Makefile
        sed -i '/^ifeq ($(DISTRO),SuSE)$/,/^endif/ s/MAN8	+= sulogin.8/MAN8	+=/' Makefile
        
        # Hapus target sulogin dari Makefile (opsional)
        sed -i '/^sulogin:/,/^$/d' Makefile
        sed -i '/^sulogin.o:/,/^$/d' Makefile
        
        # Hapus aturan untuk sulogin
        sed -i '/SULOGINLIBS/d' Makefile

    - name: Compile Sysvinit statically for ARMv7-a with hard-float
      run: |
        cd src
        make -e CC=arm-linux-gnueabihf-gcc \
             CFLAGS="-march=armv7-a -mfloat-abi=hard -mfpu=vfpv3 -static" \
             LDFLAGS="-static -march=armv7-a -mfloat-abi=hard -mfpu=vfpv3" \
             STATIC=""

    - name: Strip binaries
      run: |
        cd src
        arm-linux-gnueabihf-strip init halt shutdown runlevel killall5 fstab-decode

    - name: Verify binaries
      run: |
        cd src
        file init halt shutdown runlevel killall5 fstab-decode
        arm-linux-gnueabihf-readelf -A init | grep -E "Tag_CPU_arch|Tag_ABI_VFP_args|Tag_FP_arch"

    - name: Upload binaries as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: sysvinit-static-armv7-a-hardfloat
        path: |
          src/init
          src/halt
          src/shutdown
          src/runlevel
          src/killall5
          src/fstab-decode
