name: Build Statically Linked Sysvinit for ARM (Soft-Float)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install ARM cross-compilation tools
      run: |
        sudo apt-get update
        # Install toolchain dasar
        sudo apt-get install -y crossbuild-essential-armel
        # Install libcrypt untuk ARM (versi statis)
        sudo apt-get install -y libcrypt-dev:armel
        # Alternatif jika paket di atas tidak ditemukan
        sudo apt-get install -y libcrypt-dev-armel-cross || true

    - name: Compile Sysvinit statically for ARM with soft-float
      run: |
        cd src
        make -e CC=arm-linux-gnueabi-gcc \
             CFLAGS="-mfloat-abi=soft" \
             LDFLAGS="-static -mfloat-abi=soft"

    - name: Upload binaries as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: sysvinit-static-arm-softfloat
        path: |
          src/init
          src/halt
          src/shutdown
          src/runlevel
          src/killall5
          src/fstab-decode
          src/sulogin
