name: Build Statically Linked Sysvinit for ARM

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install cross-compilation tools and static libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gcc-arm-linux-gnueabi \
          binutils-arm-linux-gnueabi \
          libc6-dev-armel-cross \
          libcrypt-dev-armel-cross \
          make

    - name: Compile Sysvinit statically for ARM
      run: |
        cd src
        make -e CC=arm-linux-gnueabi-gcc LDFLAGS="-static"

    - name: Upload binaries as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: sysvinit-static-arm
        path: |
          src/init
          src/halt
          src/shutdown
          src/runlevel
          src/killall5
          src/fstab-decode
          src/sulogin
