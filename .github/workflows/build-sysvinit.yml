name: Build Statically Linked Sysvinit for ARM (Soft-Float)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install ARM Linux cross-compilation tools
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gcc-arm-linux-gnueabi \
          binutils-arm-linux-gnueabi \
          libc6-dev-armel-cross \
          libcrypt-dev-armel-cross \
          make

    - name: Compile Sysvinit statically for ARM with soft-float
      run: |
        cd src
        # -mfloat-abi=soft: memaksa soft-float ABI
        # -static: link statis
        # -march=armv5t: arsitektur dasar yang kompatibel dengan soft-float
        make -e CC=arm-linux-gnueabi-gcc \
             CFLAGS="-mfloat-abi=soft -march=armv5t" \
             LDFLAGS="-static -mfloat-abi=soft"

    - name: Upload binaries as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: sysvinit-static-arm-softfloat
        path: |
          src/init
          src/halt
          src/shutdown
          src/runlevel
          src/killall5
          src/fstab-decode
          src/sulogin
