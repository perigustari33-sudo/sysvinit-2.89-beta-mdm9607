name: Build Statically Linked Sysvinit for ARM (Soft-Float) - Without sulogin

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install ARM cross-compilation tools
      run: |
        sudo apt-get update
        sudo apt-get install -y crossbuild-essential-armel

    - name: Remove sulogin from Makefile
      run: |
        cd src
        # Backup Makefile
        cp Makefile Makefile.bak
        
        # Hapus sulogin dari SBIN di bagian DISTRO kosong
        sed -i '/^ifeq ($(DISTRO),)$/,/^endif/ s/SBIN	+= sulogin bootlogd/SBIN	+= bootlogd/' Makefile
        sed -i '/^ifeq ($(DISTRO),)$/,/^endif/ s/MAN8	+= sulogin.8 bootlogd.8/MAN8	+= bootlogd.8/' Makefile
        
        # Hapus sulogin dari SBIN di bagian Debian
        sed -i '/^ifeq ($(DISTRO),Debian)$/,/^endif/ s/SBIN	+= sulogin bootlogd/SBIN	+= bootlogd/' Makefile
        sed -i '/^ifeq ($(DISTRO),Debian)$/,/^endif/ s/MAN8	+= sulogin.8 bootlogd.8/MAN8	+= bootlogd.8/' Makefile
        
        # Hapus sulogin dari SBIN di bagian SuSE
        sed -i '/^ifeq ($(DISTRO),SuSE)$/,/^endif/ s/SBIN	+= sulogin/SBIN	+=/' Makefile
        sed -i '/^ifeq ($(DISTRO),SuSE)$/,/^endif/ s/MAN8	+= sulogin.8/MAN8	+=/' Makefile
        
        # Hapus target sulogin dari Makefile (opsional)
        sed -i '/^sulogin:/,/^$/d' Makefile
        sed -i '/^sulogin.o:/,/^$/d' Makefile
        
        # Hapus aturan untuk sulogin
        sed -i '/SULOGINLIBS/d' Makefile

    - name: Compile Sysvinit statically for ARM with soft-float
      run: |
        cd src
        make -e CC=arm-linux-gnueabi-gcc \
             CFLAGS="-mfloat-abi=soft" \
             LDFLAGS="-static -mfloat-abi=soft"

    - name: Upload binaries as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: sysvinit-static-arm-softfloat
        path: |
          src/init
          src/halt
          src/shutdown
          src/runlevel
          src/killall5
          src/fstab-decode
